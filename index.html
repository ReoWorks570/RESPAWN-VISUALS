<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Respawn Visuals — Техническое обслуживание</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08080a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover: rgba(139, 92, 246, 0.08);
            --border-hover: rgba(139, 92, 246, 0.5);
            --primary: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .glow-sphere {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: -150px;
            left: -150px;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
        }

        .glow-sphere-secondary {
            position: fixed;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: -150px;
            right: -150px;
            z-index: -1;
            pointer-events: none;
            filter: blur(40px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 200;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .lang-select {
            position: relative;
            display: inline-block;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            user-select: none;
        }

        .lang-btn:hover {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--border-hover);
            color: #fff;
        }

        .lang-btn::after {
            content: '▾';
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .lang-select.active .lang-btn::after {
            transform: rotate(180deg);
        }

        .lang-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #121218;
            border: 1px solid var(--border-hover);
            border-radius: 14px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 100px;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-8px) scale(0.95);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .lang-select.active .lang-menu {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .lang-option {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s ease, color 0.2s ease;
            width: 100%;
        }

        .lang-option:hover, .lang-option.active {
            background: var(--primary);
            color: #fff;
        }

        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            backdrop-filter: blur(16px);
            max-width: 550px;
            width: 100%;
            position: relative;
            overflow: hidden;
            cursor: default;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.4s ease,
                        box-shadow 0.4s ease,
                        background-color 0.4s ease;
        }

        .maintenance-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(59, 130, 246, 0.08));
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .maintenance-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--border-hover);
            box-shadow: 0 20px 45px -10px rgba(139, 92, 246, 0.3);
            background: rgba(139, 92, 246, 0.04);
        }

        .maintenance-card:hover::before {
            opacity: 1;
        }

        .maintenance-tag {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .maintenance-title {
            font-size: clamp(26px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .maintenance-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 24px;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

    <div class="glow-sphere"></div>
    <div class="glow-sphere-secondary"></div>

    <div class="container">
        <header>
            <div class="logo">RESPAWN VISUALS</div>
            
            <div class="lang-select" id="langDropdown">
                <button type="button" class="lang-btn" id="langBtn">
                    <span id="langLabel">RU</span>
                </button>
                <div class="lang-menu">
                    <button type="button" class="lang-option active" data-lang="ru" data-label="RU">RU</button>
                    <button type="button" class="lang-option" data-lang="en" data-label="EN">EN</button>
                </div>
            </div>
        </header>

        <main>
            <div class="maintenance-card">
                <div class="maintenance-tag" data-i18n="tag">СТАТУС</div>
                <h1 class="maintenance-title" data-i18n="title">Техническое обслуживание</h1>
                <p class="maintenance-desc" data-i18n="desc">Скоро всё заработает</p>
            </div>
        </main>
    </div>

    <footer>
        <p>© 2026 Respawn Visuals. <span data-i18n="footerRights">Все права защищены.</span></p>
    </footer>

    <script>
        const i18nData = {
            ru: {
                tag: "СТАТУС",
                title: "Техническое обслуживание",
                desc: "Скоро всё заработает",
                footerRights: "Все права защищены."
            },
            en: {
                tag: "STATUS",
                title: "Under Maintenance",
                desc: "We'll be back online soon",
                footerRights: "All rights reserved."
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const dropdown = document.getElementById('langDropdown');
            const toggleBtn = document.getElementById('langBtn');

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdown.classList.toggle('active');
            });

            document.addEventListener('click', () => {
                dropdown.classList.remove('active');
            });

            dropdown.querySelectorAll('.lang-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const targetLang = option.getAttribute('data-lang');
                    const targetLabel = option.getAttribute('data-label');
                    
                    dropdown.querySelectorAll('.lang-option').forEach(el => el.classList.remove('active'));
                    option.classList.add('active');
                    
                    applyLanguage(targetLang, targetLabel);
                    dropdown.classList.remove('active');
                });
            });
        });

        function applyLanguage(lang, label) {
            document.getElementById('langLabel').textContent = label;
            const dictionary = i18nData[lang];

            if (!dictionary) return;

            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (dictionary[key]) {
                    element.textContent = dictionary[key];
                }
            });
        }
    </script>
</body>
</html>
