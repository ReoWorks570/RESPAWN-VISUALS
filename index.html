<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respawn Visuals — Отзывы</title>
    
    <!-- Подключаем библиотеку Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .review-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #333;
        }
        .review-author {
            font-weight: bold;
            color: #ff9800;
        }
        .review-stars {
            color: #ffd700;
        }
        .form-group {
            margin-bottom: 10px;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #ff9800;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background: #e68a00;
        }
    </style>
</head>
<body>

    <h2>Оставить отзыв</h2>
    <form id="reviewForm">
        <div class="form-group">
            <input type="text" id="authorInput" placeholder="Ваше имя" required>
        </div>
        <div class="form-group">
            <select id="starsInput">
                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                <option value="3">⭐⭐⭐ (3/5)</option>
                <option value="2">⭐⭐ (2/5)</option>
                <option value="1">⭐ (1/5)</option>
            </select>
        </div>
        <div class="form-group">
            <textarea id="textInput" placeholder="Ваш отзыв..." rows="4" required></textarea>
        </div>
        <button type="submit" id="submitBtn">Отправить отзыв</button>
    </form>

    <hr style="margin: 30px 0; border-color: #333;">

    <h2>Все отзывы</h2>
    <div id="reviewsList">Загрузка отзывов...</div>

    <script>
        // 1. Инициализация Supabase (Вставь свои данные)
        const SUPABASE_URL = 'ТВОЙ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ТВОЙ_SUPABASE_ANON_KEY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const reviewsList = document.getElementById('reviewsList');
        const reviewForm = document.getElementById('reviewForm');
        const submitBtn = document.getElementById('submitBtn');

        // 2. Функция для загрузки отзывов из базы данных
        async function loadReviews() {
            const { data: reviews, error } = await supabase
                .from('reviews')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Ошибка загрузки отзывов:', error);
                reviewsList.innerHTML = '<p style="color: red;">Не удалось загрузить отзывы.</p>';
                return;
            }

            if (!reviews || reviews.length === 0) {
                reviewsList.innerHTML = '<p>Пока нет ни одного отзыва. Будьте первым!</p>';
                return;
            }

            reviewsList.innerHTML = '';
            reviews.forEach(review => {
                const card = document.createElement('div');
                card.className = 'review-card';
                
                const starsText = '★'.repeat(review.stars) + '☆'.repeat(5 - review.stars);

                card.innerHTML = `
                    <div class="review-author">${escapeHtml(review.author)}</div>
                    <div class="review-stars">${starsText}</div>
                    <p style="margin: 8px 0 0 0;">${escapeHtml(review.text)}</p>
                `;
                reviewsList.appendChild(card);
            });
        }

        // 3. Функция отправки нового отзыва в базу
        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'Отправка...';

            const author = document.getElementById('authorInput').value.trim();
            const stars = parseInt(document.getElementById('starsInput').value);
            const text = document.getElementById('textInput').value.trim();

            const { data, error } = await supabase
                .from('reviews')
                .insert([{ author, stars, text }]);

            if (error) {
                console.error('Ошибка при сохранении:', error);
                alert('Ошибка при отправке отзыва. Проверьте настройки таблицы в Supabase (RLS).');
            } else {
                reviewForm.reset();
                await loadReviews(); // Перезагружаем список отзывов
            }

            submitBtn.disabled = false;
            submitBtn.innerText = 'Отправить отзыв';
        });

        // Защита от XSS (чтобы не вводили вредоносный HTML в отзывы)
        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Запускаем загрузку при старте страницы
        loadReviews();
    </script>
</body>
</html>
